<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440" width="400" height="440" role="img" aria-label="FAKE FISH insignia (original parody artwork, not a government emblem)">
<title>FAKE FISH insignia (satire)</title>
<defs>
