<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>tracebankarius.com — coming soon</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at center, #1a0033 0%, #0a0015 60%, #000000 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Georgia',serif;
    overflow:hidden;
    position:relative;
  }
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .container{position:relative;z-index:1;text-align:center;padding:2rem;}
  h1{
    font-size:clamp(1.2rem,3vw,2rem);
    background:linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#0000ff,#8b00ff,#ff0000);
    background-size:200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:rainbow 4s linear infinite;
    margin-bottom:1rem;
    letter-spacing:0.1em;
  }
  @keyframes rainbow{0%{background-position:0%}100%{background-position:200%}}
  .domain{color:#c084fc;font-size:1.1rem;margin-bottom:0.5rem;letter-spacing:0.15em;}
  .sub{color:#7c3aed;font-size:0.85rem;margin-top:1.5rem;}
  .dev-link{
    position:fixed;bottom:1.5rem;right:1.5rem;
    font-size:0.7rem;color:#4b0082;text-decoration:none;
    opacity:0.4;transition:opacity 0.3s;
    letter-spacing:0.05em;
  }
  .dev-link:hover{opacity:0.8;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="container">
  <div class="domain">tracebankarius.com</div>
  <h1>something is coming</h1>
  <div class="sub">this space is being prepared</div>
</div>
<a class="dev-link" href="/dev69">dev69</a>
<script>
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const chakra=['#ff0000','#ff7700','#ffff00','#00ff00','#0000ff','#4b0082','#8b00ff'];
const stars=Array.from({length:300},()=>(({
  x:Math.random()*canvas.width,y:Math.random()*canvas.height,
  r:Math.random()*1.5+0.3,
  c:chakra[Math.floor(Math.random()*chakra.length)],
  a:Math.random(),da:(Math.random()-0.5)*0.02
})));
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a+=s.da;if(s.a<=0||s.a>=1)s.da*=-1;
    ctx.globalAlpha=s.a;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
