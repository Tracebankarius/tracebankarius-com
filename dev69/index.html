<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>dev69 — developer access</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{
    min-height:100vh;
    background:radial-gradient(ellipse at center, #1a0033 0%, #0a0015 60%, #000000 100%);
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    font-family:'Georgia',serif;
    overflow:hidden;
    position:relative;
  }
  canvas{position:fixed;top:0;left:0;width:100%;height:100%;z-index:0;pointer-events:none;}
  .container{position:relative;z-index:1;text-align:center;padding:2rem;}
  h1{
    font-size:clamp(1.5rem,4vw,2.5rem);
    background:linear-gradient(90deg,#ff0000,#ff7700,#ffff00,#00ff00,#0000ff,#8b00ff,#ff0000);
    background-size:200%;
    -webkit-background-clip:text;-webkit-text-fill-color:transparent;
    animation:rainbow 4s linear infinite;
    text-shadow:none;
    margin-bottom:1rem;
    letter-spacing:0.15em;
  }
  @keyframes rainbow{0%{background-position:0%}100%{background-position:200%}}
  p{color:#c084fc;font-size:1rem;margin-bottom:2rem;letter-spacing:0.1em;}
  .redirect-note{color:#7c3aed;font-size:0.85rem;margin-top:1rem;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div class="container">
  <h1>redirecting to developer hub...</h1>
  <p>dev69 — developer access</p>
  <div class="redirect-note">you will be redirected automatically</div>
</div>
<script>
// stars
const canvas=document.getElementById('stars');
const ctx=canvas.getContext('2d');
canvas.width=window.innerWidth;canvas.height=window.innerHeight;
const chakra=['#ff0000','#ff7700','#ffff00','#00ff00','#0000ff','#4b0082','#8b00ff'];
const stars=Array.from({length:300},()=>({
  x:Math.random()*canvas.width,y:Math.random()*canvas.height,
  r:Math.random()*1.5+0.3,
  c:chakra[Math.floor(Math.random()*chakra.length)],
  a:Math.random(),da:(Math.random()-0.5)*0.02
}));
function draw(){
  ctx.clearRect(0,0,canvas.width,canvas.height);
  stars.forEach(s=>{
    s.a+=s.da;if(s.a<=0||s.a>=1)s.da*=-1;
    ctx.globalAlpha=s.a;ctx.fillStyle=s.c;
    ctx.beginPath();ctx.arc(s.x,s.y,s.r,0,Math.PI*2);ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
// redirect after 1.5s
setTimeout(()=>{ window.location.href='https://robbinicusdebankarius.art/dev69'; },1500);
</script>
</body>
</html>
